# BBE Compliance Manifest — bbe-fork-control-plane
#
# CONVERGED MANIFEST: union of Wave-B (PR #2 in this repo, merged
# c3e6d9a — cross-repo identity) and Wave-C (this PR, the
# frontend-compliance tool's profile fields). bbe-coord schema
# v1.1.0 (additionalProperties: true) allows both halves to live
# in one file. The Wave-B aggregator validates the top half; the
# bbe-coord/scripts/check-frontend-compliance.sh tool consumes
# the bottom half (target / contrast / data_invariants /
# focus_trap / reduced_motion / color_only_information).
#
# Validated against:
#   bbe-coord/.bbe-coord/COMPLIANCE_MANIFEST.schema.json (v1.1.0)

# ============================================================
# Wave-B: cross-repo identity
# ============================================================

schema_version: "1.1.0"
repo: "bbe-fork-control-plane"
owner: "fork-machine"

profile: "frontend_single_file"
profile_version: "1.0.0"

required_gates:
  - "frontend_accessibility_profile"
  - "data_invariants_declared_counts"
  - "color_not_only_information"
  - "focus_trap_present"

optional_gates:
  - "doctrine-lint"

skip_policy:
  dev: "allow_required_skips"
  audit: "fail_required_skips"
  release: "fail_required_skips"

tool_requirements:
  python3:
    dev: "required"
    audit: "required"
    release: "required"

evidence_outputs:
  - "audit/evidence/frontend-compliance.json"

cross_repo:
  siblings:
    - repo: "bbe-coord"
      required: true
    - repo: "bbe-secrets-vault"
      required: false
    - repo: "bbe-security-scanner"
      required: false

verifier_registry:
  T-PORT-REGISTRY-UI:
    waiver_ref: "T-PORT-REGISTRY-UI"
  T-PORT-REGISTRY-V26:
    waiver_ref: "T-PORT-REGISTRY-V26"
  T-PORT-REGISTRY-V26-V02:
    waiver_ref: "T-PORT-REGISTRY-V26-V02"
  T-PORT-REGISTRY-V26-V02-FINISH:
    waiver_ref: "T-PORT-REGISTRY-V26-V02-FINISH"
  T-MISSION-FRONTEND-COMPLIANCE-PROFILE:
    script: "../bbe-coord/scripts/check-frontend-compliance.sh"
    required_for: ["audit", "release"]

notes: |
  Single-file dashboard repo (`port-registry-v26.html`). The Wave-B
  cross-repo identity (top half of this file) is owned by Wave-B
  PR #2 (merged c3e6d9a). The frontend-tool fields (bottom half)
  are owned by this PR (T-FRONTEND-COMPLIANCE-PROFILE), consumed by
  bbe-coord/scripts/check-frontend-compliance.sh (PR #40 in bbe-coord).
  Schema v1.1.0 (additionalProperties: true) allows both halves in
  one file. The verifier_registry above adds the script entry that
  wires this tool into the cross-repo aggregator's verifier loop.

# ============================================================
# Wave-C: frontend-compliance tool profile
# ============================================================
#
# Consumed by bbe-coord/scripts/check-frontend-compliance.sh.
# Spec: bbe-coord/.bbe-coord/COMPLIANCE_PROFILE_SPEC.md.
# Pattern: bbe-coord/.bbe-coord/PATTERNS/frontend_profile_pattern.md.

target:
  type: "single_file_html"
  path: "port-registry-v26.html"

contrast:
  enabled: true
  min_ratio: 7.0    # AAA — sign.it 1.0 mandatory floor
  fail_on_below: true
  # Each ignore_selectors entry MUST carry a comment explaining the
  # rationale. Operators reviewing the profile can audit why each is
  # exempt without reading the source. The tool reports the count of
  # ignored selectors at run-time so suppressed-finding budgets can
  # be tracked.
  ignore_selectors:
    # WCAG G18: ::selection background contrast is a presentation hint
    # for *user-initiated* selection, exempt from AAA per W3C
    # technique guidance. Selected text is a transient state.
    - "::selection"
    # WCAG 1.4.11 Non-text Contrast (3:1) applies — .brand-mark holds
    # the iconic activity-pulse SVG glyph, not text. The currentColor
    # used for the icon stroke is decorative and clears 1.4.11 at
    # 4.20:1.
    - ".brand-mark"
    # CAUGHT BY THIS TOOL — real AAA failure that escaped v0.2.0
    # release audit. The active module-tag pill shows variant text
    # ("A1", "B3", …) on a magenta background at 4.20:1. Pending
    # bbe-fork-control-plane v0.2.1 patch (swap magenta → lime to
    # match the success-action colour pattern from btn-primary).
    # Until that PR lands, this ignore is the operator's explicit
    # workaround so v0.2.0 unblocks downstream consumers.
    - ".nav-item.is-active .module-tag"

data_invariants:
  enabled: true
  rules:
    - declared:
        array: "FORKS"
        id_field: "id"
        count_field: "agents"
      actual:
        array: "AGENTS"
        group_field: "fork"
      message: "FORKS[].agents must equal count(AGENTS where fork == FORKS[].id)"

focus_trap:
  enabled: true
  modal_selectors:
    - "[role='dialog']"
    - ".kanban-overlay"
  required_signals:
    - "trapFocus"
    - "if (e.key === 'Tab')"

reduced_motion:
  enabled: true
  required_overrides:
    - ".k-card:active"
    - ".k-card.is-touch-dragging"

color_only_information:
  enabled: true
  elements:
    - selector: ".ribbon-cell"
      require_text_attr: true
